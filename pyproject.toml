[project]
name = "genesis"
version = "0.5.0"
description = "Pipeline de validación institucional para prop firms: torneo de candidatos de estrategia bajo gates mecánicos (Spec Génesis v1.4)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "metatrader5>=5.0.5735 ; sys_platform == 'win32'",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
mt5-export = "genesis.data.mt5_export:main"
genesis-validate = "genesis.validation.signal_diagnostic:main"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "hypothesis>=6.167.1",
  "pydantic>=2.13.5",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.15.14",
  "tokei-pie>=1.2.2",
  "ty>=0.0.82",
  "vulture>=2.16",
  "pulse-hooks-lib",
  "types-pyyaml>=6.0.12.20260906",
  "databento>=0.66",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  ".venv",
  "venv",
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "S"]
ignore = ["N802", "N805", "RUF001", "RUF002"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
".agents/hooks/_lib/tests/**/*.py" = ["S101", "S603", "S607", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--disable-warnings",
  "-x",
  "--timeout=30",
]
markers = [
  "unit: Unit tests (isolated, no I/O, < 100ms each)",
  "integration: Integration tests (2+ components, may use filesystem)",
  "e2e: End-to-end tests (full system, runs just commands)",
  "statistical: Tests estadísticos (dsr_pbo, purged_cv contra casos publicados)",
  "slow: Slow running tests",
]

[tool.vulture]
min_confidence = 80
paths = ["src", "tests", "tests/whitelist_vulture.py"]
ignore_names = ["cls", "app", "prompt", "model"]

[tool.ty]
environment = { python-version = "3.14", root = ["src", ".agents/hooks/_lib", "."] }

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-attribute = "error"
invalid-argument-type = "error"
invalid-return-type = "error"

[tool.deptry]
extend_exclude = [".venv", "venv", ".git"]
known_first_party = ["genesis", "pulse_hooks_lib"]
package_module_name_map = { "pyyaml" = "yaml", "gitpython" = "git", "MetaTrader5" = "MetaTrader5" }
# MetaTrader5 se importa vía importlib (opaco para deptry) y su marker win32 lo excluye
# del entorno Linux del gate determinista de cierre: sin esta excepción deptry lo
# reporta como DEP002 (no usado) en Windows y DEP001 (faltante) en Linux.
# pyarrow es el engine de Parquet que pandas importa dinámicamente (read_parquet/
# to_parquet en RawParquetStore): nunca hay `import pyarrow` literal → DEP002 falso.
per_rule_ignores = { DEP001 = ["MetaTrader5", "metatrader5"], DEP002 = ["MetaTrader5", "metatrader5", "pyarrow"] }

[tool.bandit]
exclude_dirs = ["tests", ".agents/hooks/_lib/tests", ".venv", "venv"]
skips = ["B101", "B105", "B404", "B603", "B607"]

[tool.uv.sources]
pulse-hooks-lib = { path = ".agents/hooks/_lib", editable = false }
